name: Release website

on:
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write

    runs-on: windows-latest

    steps:
      - name: Checkout year repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.20.0"

      - name: Prepare source deploy key
        shell: pwsh
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.INFORMATICA_SOURCE_DEPLOY_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $sshDir = Join-Path $HOME ".ssh"

          New-Item `
            -ItemType Directory `
            -Path $sshDir `
            -Force | Out-Null

          $keyPath = Join-Path `
            $sshDir `
            "onc_informatica_2627_source"

          $keyText = $env:SOURCE_DEPLOY_KEY.Replace(
            "`r`n",
            "`n"
          )

          if (-not $keyText.EndsWith("`n")) {
            $keyText += "`n"
          }

          [System.IO.File]::WriteAllText(
            $keyPath,
            $keyText,
            [System.Text.UTF8Encoding]::new($false)
          )

          icacls `
            $keyPath `
            /inheritance:r `
            /grant:r "$($env:USERNAME):(R)" |
            Out-Null

          $knownHosts = Join-Path $sshDir "known_hosts"

          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "informatica-2627-release"
          }

          $githubMeta = Invoke-RestMethod `
            -Uri "https://api.github.com/meta" `
            -Headers $headers

          $githubMeta.ssh_keys |
            ForEach-Object {
              "github.com $_"
            } |
            Set-Content `
              -Path $knownHosts `
              -Encoding ascii

      - name: Prepare exporter deploy key
        shell: pwsh
        env:
          EXPORT_DEPLOY_KEY: ${{ secrets.INFORMATICA_EXPORT_DEPLOY_KEY }}
        run: |
          $sshDir = Join-Path $HOME ".ssh"

          $keyPath = Join-Path `
            $sshDir `
            "onc_informatica_export"

          $keyText = $env:EXPORT_DEPLOY_KEY.Replace(
            "`r`n",
            "`n"
          )

          if (-not $keyText.EndsWith("`n")) {
            $keyText += "`n"
          }

          [System.IO.File]::WriteAllText(
            $keyPath,
            $keyText,
            [System.Text.UTF8Encoding]::new($false)
          )

          icacls `
            $keyPath `
            /inheritance:r `
            /grant:r "$($env:USERNAME):(R)" |
            Out-Null

      - name: Install informatica exporter
        shell: pwsh
        run: |
          $exportKey = Join-Path `
            $HOME `
            ".ssh\onc_informatica_export"

          $env:GIT_SSH_COMMAND = `
            "ssh -i `"$exportKey`" -o IdentitiesOnly=yes"

          python -m pip install `
            "git+ssh://git@github.com/oncparkdreef/informatica-export.git@main"

          informatica-export --help

      - name: Install Module01 Python dependencies
        shell: pwsh
        run: |
          $sourceKey = Join-Path `
            $HOME `
            ".ssh\onc_informatica_2627_source"

          $env:GIT_SSH_COMMAND = `
            "ssh -i `"$sourceKey`" -o IdentitiesOnly=yes"

          $dependencySource = Join-Path `
            $env:RUNNER_TEMP `
            "informatica-source-dependencies"

          git clone `
            --branch main `
            --single-branch `
            --depth 1 `
            git@github.com:oncparkdreef/informatica-2627-source.git `
            $dependencySource

          python -m pip install `
            -r "$dependencySource\module01\requirements.txt"

          python -m mkdocs --version

      - name: Build website release
        shell: pwsh
        run: |
          python website-release/release_website.py

      - name: Verify website release output
        shell: pwsh
        run: |
          $moduleIndex = "public-site\module01\index.html"
          $errorPage = "public-site\404.html"

          if (-not (Test-Path $moduleIndex)) {
            throw "Ontbreekt: $moduleIndex"
          }

          if (-not (Test-Path $errorPage)) {
            throw "Ontbreekt: $errorPage"
          }

          Write-Host "Gevonden: $moduleIndex"
          Write-Host "Gevonden: $errorPage"

      - name: Prepare website files for publication
        shell: pwsh
        run: |
          Remove-Item "module01" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Copy-Item `
            "public-site\module01" `
            "module01" `
            -Recurse

          Copy-Item `
            "public-site\404.html" `
            "404.html" `
            -Force

          Write-Host "Klaar voor publicatie: module01"
          Write-Host "Klaar voor publicatie: 404.html"

      - name: Show publication changes
        shell: pwsh
        run: |
          git status --short

      - name: Publish website release
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- `
            "module01" `
            "404.html" `
            "website-release/release-plans/website.csv"

          $changes = git diff --cached --name-only

          if (-not $changes) {
            Write-Host "Geen publicatiewijzigingen om te committen."
            exit 0
          }

          git commit -m "Release website"
          git push origin HEAD:main